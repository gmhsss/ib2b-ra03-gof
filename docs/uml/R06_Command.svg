itacaoCirculacao--><path d="M260,338.1131 C260,359.5431 260,386.3931 260,409.6531 " fill="none" id="ExecutorSolicitacoes-SolicitacaoCirculacao" style="stroke: #315671; stroke-width: 1.0;"/><polygon fill="#315671" points="260,414.8631,264,405.8631,260,409.8631,256,405.8631,260,414.8631" style="stroke: #315671; stroke-width: 1.0;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="132" x="261" y="381.02">executa 1x por UUID</text><!--link SolicitacaoReserva to CirculacaoFacade--><path d="M226.79,645.1331 C244.43,668.3031 266.99,697.9231 282.16,717.8331 " fill="none" id="SolicitacaoReserva-CirculacaoFacade" style="stroke: #315671; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#315671" points="285.28,721.9331,283.0032,712.3511,282.2481,717.9573,276.6418,717.2022,285.28,721.9331" style="stroke: #315671; stroke-width: 1.0;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="63" x="262" y="688.02">reservar()</text><!--link SolicitacaoRenovacao to CirculacaoFacade--><path d="M372.67,645.1331 C354.67,668.3031 331.66,697.9231 316.18,717.8331 " fill="none" id="SolicitacaoRenovacao-CirculacaoFacade" style="stroke: #315671; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#315671" points="313,721.9331,321.6864,717.2912,316.0727,717.9887,315.3752,712.375,313,721.9331" style="stroke: #315671; stroke-width: 1.0;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="59" x="350" y="688.02">renovar()</text><!--
@startuml
skinparam shadowing false
skinparam classAttributeIconSize 0
skinparam defaultFontName DejaVu Sans
skinparam ArrowColor #315671
skinparam class {
 BackgroundColor #EAF3FA
 BorderColor #315671
}
hide empty members
title R06 | Command — solicitações de circulação
interface SolicitacaoCirculacao <<Command>> {
 +identificador(): UUID
 +autor(): String
 +criadaEm(): Instant
 +executar(f: CirculacaoFacade): Comprovante
}
class SolicitacaoReserva <<ConcreteCommand>> {
 livro: String
 dia: LocalDate
}
class SolicitacaoRenovacao <<ConcreteCommand>> {
 livro: String
 dia: LocalDate
}
class ExecutorSolicitacoes <<Invoker>> {
 -feitos: Map<UUID, Comprovante>
 +executar(c: SolicitacaoCirculacao): Comprovante {synchronized}
}
class CirculacaoFacade <<Receiver>>
class Main <<Client>>
class TratadorDeEmprestimo {
 +processar(c: SolicitacaoCirculacao): Comprovante
}
SolicitacaoCirculacao <|.. SolicitacaoReserva
SolicitacaoCirculacao <|.. SolicitacaoRenovacao
Main ..> SolicitacaoReserva : cria
Main ..> SolicitacaoRenovacao : cria
Main - -> TratadorDeEmprestimo : encaminha
TratadorDeEmprestimo - -> ExecutorSolicitacoes
ExecutorSolicitacoes - -> SolicitacaoCirculacao : executa 1x por UUID
SolicitacaoReserva ..> CirculacaoFacade : reservar()
SolicitacaoRenovacao ..> CirculacaoFacade : renovar()
@enduml

