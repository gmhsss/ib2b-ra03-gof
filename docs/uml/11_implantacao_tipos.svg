 em produção</text><!--link client to GMN15--><path d="M450.1474,194.2495 C450.6659,194.2452 451.2066,194.2421 451.769,194.2404 C452.8937,194.2372 454.1047,194.2398 455.3963,194.2507 C457.9796,194.2725 460.8854,194.327 464.0678,194.4325 C476.7975,194.8544 493.9538,196.0906 512.605,199.2981 C549.9075,205.7131 593.19,220.0131 619,251.4531 C657.25,298.0431 652.23,374.1631 646.14,414.2831 " fill="none" id="client-GMN15" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><!--link prod to GMN18--><path d="M842,529.1662 C842,529.7561 842,530.3465 842,530.9372 C842,532.1188 842,533.302 842,534.4862 C842,536.8545 842,539.2267 842,541.5969 C842,551.0779 842,560.5277 842,569.5783 C842,587.6794 842,604.1831 842,616.1431 " fill="none" id="prod-GMN18" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><!--
@startuml
title Implantação — TIPOS de nós (implementação CLI em Java 17)
skinparam shadowing false
skinparam defaultFontName DejaVu Sans
node "Computador" as client {
 node "JVM Java 17+" as jvm {
  artifact "ib2b-ra03-gof.jar\nCLI + Tratadores + GoF" as app
  artifact "BancoASimulado / BancoBSimulado\n(classes Java, mesmo processo)" as sim
 }
}
node "Servidor de banco de dados (perfil produção)" as prod {
 node "MySQL 8.x / InnoDB" as mysql {
  database "ib2b" as db
 }
}
node "<<externo, NÃO implementado>>\nAPI do banco real" as real #EEEEEE
app ..> sim : GatewayCobranca\n(Adapter, chamada local)
jvm - -> mysql : JDBC / TCP 3306\n(só com IB2B_PERFIL=mysql)
sim .. real : substituiria em produção
note bottom of client
Perfil de TESTE: família em memória,
nenhuma conexão de rede.
Os bancos A e B são SIMULADOS dentro da JVM.
end note
note bottom of prod
Oracle do RA02: réplica externa,
não recebe escritas da aplicação.
end note
@enduml

