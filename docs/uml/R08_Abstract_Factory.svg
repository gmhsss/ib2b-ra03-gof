: 7.0,7.0;"/><polygon fill="#315671" points="978.69,361.8531,972.1242,354.5122,974.1304,359.8013,968.8412,361.8075,978.69,361.8531" style="stroke: #315671; stroke-width: 1.0;"/><!--link FabricaPersistencia to UnidadeDeTrabalho--><path d="M824.54,261.5231 C914.63,282.8531 1034,312.8831 1138,344.9531 C1152.62,349.4631 1168.29,354.9031 1182.63,360.1431 " fill="none" id="FabricaPersistencia-UnidadeDeTrabalho" style="stroke: #315671; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#315671" points="1187.45,361.9131,1180.3906,355.0454,1182.759,360.1826,1177.6218,362.551,1187.45,361.9131" style="stroke: #315671; stroke-width: 1.0;"/><!--link SistemaIB2B to FabricaPersistencia--><path d="M685,82.1331 C685,104.9231 685,139.0831 685,168.6231 " fill="none" id="SistemaIB2B-FabricaPersistencia" style="stroke: #315671; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#315671" points="685,173.6931,689,164.6931,685,168.6931,681,164.6931,685,173.6931" style="stroke: #315671; stroke-width: 1.0;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="109" x="686" y="125.02">escolhe UMA vez</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="87" x="697" y="140.1528">(IB2B_PERFIL)</text><!--
@startuml
skinparam shadowing false
skinparam classAttributeIconSize 0
skinparam defaultFontName DejaVu Sans
skinparam ArrowColor #315671
skinparam class {
 BackgroundColor #EAF3FA
 BorderColor #315671
}
hide empty members
title R08 | Abstract Factory — famílias de acesso aos dados
interface FabricaPersistencia <<AbstractFactory>> {
 +livros(): LivroRepositorio
 +movimentacao(): MovimentacaoRepositorio
 +relacionamento(): RelacionamentoRepositorio
 +unidadeDeTrabalho(): UnidadeDeTrabalho
 +familia(): String
}
class FabricaMemoria <<ConcreteFactory>>
class FabricaMySQL <<ConcreteFactory>> {
 -fonte: FonteDeConexoes
 -atual: ThreadLocal<Connection>
}
interface LivroRepositorio <<AbstractProduct>>
interface MovimentacaoRepositorio <<AbstractProduct>>
interface RelacionamentoRepositorio <<AbstractProduct>>
interface UnidadeDeTrabalho <<AbstractProduct>>
class SistemaIB2B {
 +{static} inicializar(perfil, ...)
}
FabricaPersistencia <|.. FabricaMemoria
FabricaPersistencia <|.. FabricaMySQL
FabricaPersistencia ..> LivroRepositorio
FabricaPersistencia ..> MovimentacaoRepositorio
FabricaPersistencia ..> RelacionamentoRepositorio
FabricaPersistencia ..> UnidadeDeTrabalho
SistemaIB2B ..> FabricaPersistencia : escolhe UMA vez\n(IB2B_PERFIL)
note bottom of FabricaMemoria
  produtos: classes internas;
  UoW = snapshot + restauração
end note
note bottom of FabricaMySQL
  produtos: classes internas JDBC;
  os 3 repositórios usam a Connection
  da UoW em curso (commit/rollback).
  Oracle: réplica, sem escrita.
end note
@enduml

