0000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="239" x="849" y="277.4575">[diasAtraso &gt; 0] ServicoMultas.emitir</text><polygon fill="#A80036" points="966,307.6563,976,311.6563,966,315.6563,970,311.6563" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="539.5" x2="972" y1="311.6563" y2="311.6563"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="97" x="546.5" y="306.5903">aoDevolver(ev)</text><polygon fill="#A80036" points="1101,336.7891,1111,340.7891,1101,344.7891,1105,340.7891" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="539.5" x2="1107" y1="340.7891" y2="340.7891"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="97" x="546.5" y="335.7231">aoDevolver(ev)</text><polygon fill="#A80036" points="550.5,365.9219,540.5,369.9219,550.5,373.9219,546.5,369.9219" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="544.5" x2="1112" y1="369.9219" y2="369.9219"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="131" x="556.5" y="364.856">exceção (SMTP fora)</text><line style="stroke: #A80036; stroke-width: 1.0;" x1="539.5" x2="581.5" y1="414.1875" y2="414.1875"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="581.5" x2="581.5" y1="414.1875" y2="427.1875"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="540.5" x2="581.5" y1="427.1875" y2="427.1875"/><polygon fill="#A80036" points="550.5,423.1875,540.5,427.1875,550.5,431.1875,546.5,427.1875" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="154" x="546.5" y="393.9888">guarda FalhaNotificacao</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="109" x="546.5" y="409.1216">na fila de reenvio</text><path d="M18,440.1875 L18,480.1875 L1169,480.1875 L1169,450.1875 L1159,440.1875 L18,440.1875 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M1159,440.1875 L1159,450.1875 L1169,450.1875 L1159,440.1875 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="425" x="376.75" y="457.2544">A devolução já foi confirmada: nenhuma falha de ouvinte a desfaz.</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="281" x="376.75" y="472.3872">O livro continua DEVOLVIDO até a inspeção.</text><!--
@startuml
title R05 | Observer — devolução atrasada
skinparam shadowing false
skinparam defaultFontName DejaVu Sans
participant "CirculacaoFacade" as F
participant "UnidadeDeTrabalho" as U
participant "PublicadorDevolucao" as P
participant "OuvinteInspecao" as I
participant "OuvinteMultas" as M
participant "OuvinteIndicadores" as N
participant "OuvinteEmail" as E
F -> U : executar(devolver + encerrar empréstimo)
U - -> F : commit (livro DEVOLVIDO)
F -> P : publicar(EventoDevolucao)
P -> I : aoDevolver(ev)
note right of I : livro entra na fila de inspeção
P -> M : aoDevolver(ev)
note right of M : [diasAtraso > 0] ServicoMultas.emitir
P -> N : aoDevolver(ev)
P -> E : aoDevolver(ev)
E - -> P : exceção (SMTP fora)
P -> P : guarda FalhaNotificacao\nna fila de reenvio
note over F, E : A devolução já foi confirmada: nenhuma falha de ouvinte a desfaz.\nO livro continua DEVOLVIDO até a inspeção.
@enduml

