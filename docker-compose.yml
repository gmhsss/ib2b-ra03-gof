services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ib2b
      MYSQL_USER: ib2b
      MYSQL_PASSWORD: ib2b
      MYSQL_ROOT_PASSWORD: raiz-dev-local
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - ib2b_mysql_data:/var/lib/mysql
volumes:
  ib2b_mysql_data:
